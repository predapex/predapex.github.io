<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Tank-Pump System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .control-panel {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #eee;
        }

        .status {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        .pump-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ccc;
            margin-right: 8px;
        }

        .pump-indicator.on {
            background-color: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
        }

        .pump-indicator.off {
            background-color: #e74c3c;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-reset {
            background-color: #95a5a6;
            color: white;
        }

        .btn-reset:hover {
            background-color: #7f8c8d;
        }

        .tank-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .tank-section {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .tank-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 0.8rem;
            color: #2c3e50;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.5rem;
        }

        .valve-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .valve-btn {
            background: white;
            border: 1px solid #bdc3c7;
            color: #555;
            padding: 8px;
            font-size: 0.8rem;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .valve-btn:hover {
            background: #ecf0f1;
        }

        .valve-btn.active {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }

        .number-badge {
            background: #eee;
            color: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        .valve-btn.active .number-badge {
            background: rgba(255,255,255,0.3);
            color: white;
        }
    </style>
</head>
<body>

<div class="control-panel">
    <div class="header">
        <div class="status">
            <span id="pump-light" class="pump-indicator off"></span>
            Pump: <span id="pump-text">OFF</span>
        </div>
        <button class="btn-reset" onclick="resetSystem()">Reset Valves</button>
    </div>

    <div class="controls">
        <button class="btn-primary" id="pump-btn" onclick="togglePump()">
            Pump
        </button>
        <!-- Placeholder for layout balance -->
        <div></div> 
    </div>

    <div class="tank-grid">
        <!-- Tank 1 -->
        <div class="tank-section">
            <div class="tank-title">TANK 1</div>
            <div class="valve-group">
                <button class="valve-btn" onclick="toggleValve(this)">
                    TO TANK 1 <span class="number-badge">1</span>
                </button>
                <button class="valve-btn" onclick="toggleValve(this)">
                    FROM TANK 1 <span class="number-badge">1</span>
                </button>
            </div>
        </div>

        <!-- Tank 2 -->
        <div class="tank-section">
            <div class="tank-title">TANK 2</div>
            <div class="valve-group">
                <button class="valve-btn" onclick="toggleValve(this)">
                    TO TANK 2 <span class="number-badge">2</span>
                </button>
                <button class="valve-btn" onclick="toggleValve(this)">
                    FROM TANK 2 <span class="number-badge">2</span>
                </button>
            </div>
        </div>

        <!-- Tank 3 -->
        <div class="tank-section">
            <div class="tank-title">TANK 3</div>
            <div class="valve-group">
                <button class="valve-btn" onclick="toggleValve(this)">
                    TO TANK 3 <span class="number-badge">3</span>
                </button>
                <button class="valve-btn" onclick="toggleValve(this)">
                    FROM TANK 3 <span class="number-badge">3</span>
                </button>
            </div>
        </div>

        <!-- Tank 4 -->
        <div class="tank-section">
            <div class="tank-title">TANK 4</div>
            <div class="valve-group">
                <button class="valve-btn" onclick="toggleValve(this)">
                    TO TANK 4 <span class="number-badge">4</span>
                </button>
                <button class="valve-btn" onclick="toggleValve(this)">
                    FROM TANK 4 <span class="number-badge">4</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let isPumpOn = false;

    function togglePump() {
        isPumpOn = !isPumpOn;
        const pumpText = document.getElementById('pump-text');
        const pumpLight = document.getElementById('pump-light');
        const pumpBtn = document.getElementById('pump-btn');

        if (isPumpOn) {
            pumpText.textContent = "ON";
            pumpLight.classList.remove('off');
            pumpLight.classList.add('on');
            pumpBtn.style.backgroundColor = "#2ecc71";
            pumpBtn.textContent = "Pump (ON)";
        } else {
            pumpText.textContent = "OFF";
            pumpLight.classList.remove('on');
            pumpLight.classList.add('off');
            pumpBtn.style.backgroundColor = "#3498db";
            pumpBtn.textContent = "Pump";
        }
    }

    function toggleValve(btn) {
        btn.classList.toggle('active');
    }

    function resetSystem() {
        isPumpOn = false;
        document.getElementById('pump-text').textContent = "OFF";
        document.getElementById('pump-light').classList.remove('on');
        document.getElementById('pump-light').classList.add('off');
        document.getElementById('pump-btn').style.backgroundColor = "#3498db";
        document.getElementById('pump-btn').textContent = "Pump";

        // Reset all valves
        const valves = document.querySelectorAll('.valve-btn');
        valves.forEach(v => v.classList.remove('active'));
        
        alert("System Reset: Pump OFF and all Valves closed.");
    }
</script>

</body>
</html>
