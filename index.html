<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tank Pump System</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f4f6f8;
    }

    h1 {
        margin-top: 20px;
    }

    .controls {
        margin: 20px;
    }

    button {
        padding: 10px 15px;
        margin: 5px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    .pump {
        background: #ccc;
    }

    .pump.on {
        background: #4caf50;
        color: white;
    }

    .valve {
        background: #ddd;
    }

    .valve.selected {
        background: #2196f3;
        color: white;
    }

    svg {
        margin-top: 20px;
        background: white;
        border: 1px solid #ccc;
    }

    .pipe {
        stroke: #999;
        stroke-width: 6;
        fill: none;
    }

    .flow {
        stroke: #00c853;
        stroke-width: 6;
        fill: none;
        stroke-dasharray: 10;
        animation: flow 1s linear infinite;
    }

    @keyframes flow {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
    }
</style>
</head>

<body>

<h1>Tank Pump System</h1>

<div class="controls">
    <button id="pumpBtn" class="pump">Pump OFF</button>
    <button onclick="reset()">Reset Valves</button>
</div>

<h3>Suction (FROM)</h3>
<div id="suction"></div>

<h3>Return (TO)</h3>
<div id="return"></div>

<svg width="600" height="300">
    <!-- Tanks -->
    <rect x="50" y="100" width="80" height="120" fill="#ddd"/>
    <rect x="180" y="100" width="80" height="120" fill="#ddd"/>
    <rect x="310" y="100" width="80" height="120" fill="#ddd"/>
    <rect x="440" y="100" width="80" height="120" fill="#ddd"/>

    <text x="70" y="240">T1</text>
    <text x="200" y="240">T2</text>
    <text x="330" y="240">T3</text>
    <text x="460" y="240">T4</text>

    <!-- Pipes -->
    <path id="flowLine" class="pipe" d="M90 100 L90 50 L500 50 L500 100"/>
</svg>

<script>
let pumpOn = false;
let suction = null;
let ret = null;

const tanks = ["Tank 1", "Tank 2", "Tank 3", "Tank 4", "Pool"];

const suctionDiv = document.getElementById("suction");
const returnDiv = document.getElementById("return");

tanks.forEach(t => {
    let b1 = document.createElement("button");
    b1.innerText = t;
    b1.className = "valve";
    b1.onclick = () => selectValve("suction", t, b1);
    suctionDiv.appendChild(b1);

    let b2 = document.createElement("button");
    b2.innerText = t;
    b2.className = "valve";
    b2.onclick = () => selectValve("return", t, b2);
    returnDiv.appendChild(b2);
});

function selectValve(type, tank, btn) {
    let group = type === "suction" ? suctionDiv : returnDiv;

    [...group.children].forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");

    if (type === "suction") suction = tank;
    else ret = tank;

    updateFlow();
}

document.getElementById("pumpBtn").onclick = () => {
    pumpOn = !pumpOn;
    const btn = document.getElementById("pumpBtn");

    btn.classList.toggle("on");
    btn.innerText = pumpOn ? "Pump ON" : "Pump OFF";

    updateFlow();
};

function reset() {
    suction = null;
    ret = null;

    document.querySelectorAll(".valve").forEach(b => b.classList.remove("selected"));
    document.getElementById("flowLine").classList.remove("flow");
}

function updateFlow() {
    const line = document.getElementById("flowLine");

    if (pumpOn && suction && ret) {
        line.classList.add("flow");
    } else {
        line.classList.remove("flow");
    }
}
</script>

</body>
</html>
